name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Create Capacitor Config & Add Android Platform
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mystreamflix.app",
            "appName": "MyStreamFlix",
            "webDir": "public",
            "server": {
              "url": "https://mystreamflix.biz.id",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "backgroundColor": "#09090b"
            }
          }
          EOF
          npx cap add android

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStreamFlix-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
