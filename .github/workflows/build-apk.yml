name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Capacitor Config & Android Platform
        run: |
          npm install @capacitor/core@latest @capacitor/android@latest @capacitor/cli@latest
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mystreamflix.app",
            "appName": "MyStreamFlix",
            "webDir": "public",
            "server": {
              "url": "https://mystreamflix.biz.id",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "backgroundColor": "#09090b"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStreamFlix-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
