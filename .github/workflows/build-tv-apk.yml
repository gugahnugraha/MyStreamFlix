name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tv/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

jobs:
  build-tv:
    name: Build Android TV APK (Leanback & D-Pad)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Wrapper & Build Android TV APK
        run: |
          cd tv/android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          APK_DIR="tv/android/app/build/outputs/apk/debug"
          if [ -f "$APK_DIR/app-debug.apk" ]; then
            cp "$APK_DIR/app-debug.apk" "$APK_DIR/MyStreamFlix-TV-v1.0.0-debug.apk"
          fi

      - name: Upload Android TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStreamFlix-Android-TV-APK
          path: |
            tv/android/app/build/outputs/apk/debug/MyStreamFlix-TV-v1.0.0-debug.apk
            tv/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TV-Build-Logs
          path: |
            tv/android/app/build/reports/**
            tv/android/app/build/outputs/logs/**
          if-no-files-found: ignore
