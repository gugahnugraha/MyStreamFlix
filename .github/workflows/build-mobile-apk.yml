name: Build Mobile Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'public/**'
      - '.github/workflows/build-mobile-apk.yml'
  workflow_dispatch:

jobs:
  build-mobile-apk:
    name: Build Mobile Android APK (ExoPlayer & Fullscreen)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Sync Capacitor Android Assets & Plugins
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug Android APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          APK_DIR="android/app/build/outputs/apk/debug"
          if [ -f "$APK_DIR/app-debug.apk" ]; then
            cp "$APK_DIR/app-debug.apk" "$APK_DIR/MyStreamFlix-Mobile-v1.0.0-debug.apk"
          fi

      - name: Upload Mobile Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStreamFlix-Mobile-Android-APK
          path: |
            android/app/build/outputs/apk/debug/MyStreamFlix-Mobile-v1.0.0-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Build-Logs
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
