name: Build Mobile Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'public/**'
      - '.github/workflows/build-mobile-apk.yml'
  workflow_dispatch:

jobs:
  build-mobile-apk:
    name: Build Mobile Android APK (ExoPlayer & Fullscreen)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;35.0.0'


      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Prepare Android Web Assets Directory
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/ || true
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Sync Capacitor Android
        run: |
          npx --yes @capacitor/cli sync android --no-build || ./node_modules/.bin/cap sync android || true

      - name: Ensure Cordova Plugin Files Exist
        run: |
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            echo "ext { cdvMinSdkVersion = 24; cdvPluginPostBuildExtras = []; cordovaConfig = [:] }" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          fi
          if [ ! -f "android/capacitor-cordova-android-plugins/build.gradle" ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/build.gradle
          ext {
              androidxAppCompatVersion = '1.7.1'
              cordovaAndroidVersion = '14.0.1'
          }
          apply plugin: 'com.android.library'
          android {
              namespace = "capacitor.cordova.android.plugins"
              compileSdk = 35
              defaultConfig { minSdkVersion 24; targetSdk 35 }
          }
          EOF
          fi
          if [ ! -f "android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="capacitor.cordova.android.plugins" />' > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Debug Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          find android/ -name "*.apk" -type f -exec cp -v {} release-apk/ \;
          ls -la release-apk/
          if [ -z "$(ls -A release-apk)" ]; then
            echo "::error::No APK found in android/ directory after build!"
            find android/ -type f
            exit 1
          fi

      - name: Upload Mobile Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStreamFlix-Mobile-Android-APK
          path: release-apk/
          if-no-files-found: error





      - name: Upload Detailed Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Gradle-Build-Log
          path: gradle_output.txt
          if-no-files-found: ignore

