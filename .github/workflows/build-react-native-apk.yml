name: Build React Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (React Native + ExoPlayer)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          cd mobile && npm install --legacy-peer-deps

      - name: Generate Android Native Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Grant Execute Permission for Gradle
        run: chmod +x mobile/android/gradlew

      - name: Build Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload React Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStreamFlix-ReactNative-ExoPlayer-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
